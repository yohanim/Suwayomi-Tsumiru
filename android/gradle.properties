org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=512m
# Independent modules/tasks run concurrently, and outputs are cached and
# reused across the 3 --split-per-abi variants, which otherwise redo most of
# the same Kotlin/Java compilation and resource processing three times.
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
# Stays false until the app upgrades to Flutter 3.47+ (that's the minimum
# version whose flutter-gradle-plugin actually supports true, per
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers).
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
